[project]
name = "synology-photos-thumbgen"
version = "0.1.0"
description = "Automatic preview thumbnail generator for Synology Photos using ffmpeg and the ConvertedFile API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pillow>=11.0",
    "pillow-heif>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
synology-thumbgen = "synology_thumbgen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synology_thumbgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
